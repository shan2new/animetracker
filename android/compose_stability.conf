// Compose stability configuration.
//
// `:model` is a pure Kotlin JVM module, so the Compose compiler cannot infer stability for its types
// — every one crosses into a composable as UNSTABLE. The consequence is not theoretical: any
// composable taking a Franchise / FranchisePart / Airing becomes non-skippable, so the app's periodic
// `now` tick (20 s) would recompose every row on every tab on every tick.
//
// Belt and braces with the @Immutable annotations on the types themselves: this file covers types
// added later without an annotation, and the annotations survive someone deleting this file.
com.anitrack.model.**
